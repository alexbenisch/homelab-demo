<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No-Deposit Rental Platform</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 4rem auto; padding: 0 1rem; color: #333; }
    h1 { font-size: 2rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    .portals { display: flex; gap: 1rem; flex-wrap: wrap; }
    .portal { padding: 1rem 2rem; background: #f5f5f5; border-radius: 8px; text-decoration: none; color: #333; border: 1px solid #ddd; }
    .portal:hover { background: #e8e8e8; }
    .logout { display: inline-block; margin-top: 1.5rem; padding: 0.3rem 0.8rem; background: #f5f5f5; border: 1px solid #ddd; border-radius: 4px; color: #333; text-decoration: none; font-size: 0.85rem; }
    .logout:hover { background: #e8e8e8; }
  </style>
</head>
<body>
  <h1>No-Deposit Rental Platform</h1>
  {% if email %}<p class="meta">Signed in as <strong>{{ email }}</strong> &middot; roles: {{ roles|join:", " }}</p>{% endif %}
  <div class="portals">
    <a class="portal" href="/tenant/">Tenant</a>
    <a class="portal" href="/landlord/">Landlord</a>
    <a class="portal" href="/agency/">Agency</a>
    <a class="portal" href="/admin/">Admin</a>
  </div>
  {% if email %}<a href="/oauth2/sign_out?rd=https%3A%2F%2Fauth.kubetest.uk%2Frealms%2Fno-deposit%2Fprotocol%2Fopenid-connect%2Flogout" class="logout">Sign out</a>{% endif %}
</body>
</html>
