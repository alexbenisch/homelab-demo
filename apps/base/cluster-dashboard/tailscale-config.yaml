apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-dashboard
  annotations:
    tailscale.com/hostname: cluster-dashboard
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cluster-dashboard
                port:
                  number: 80
  tls:
    - hosts:
        - cluster-dashboard
