apiVersion: batch/v1
kind: Job
metadata:
  name: no-deposit-keycloak-setup
  namespace: no-deposit
  annotations:
    # Re-run by deleting the job: kubectl delete job -n no-deposit no-deposit-keycloak-setup
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: quay.io/keycloak/keycloak:24.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              KC=http://keycloak.keycloak.svc.cluster.local:8080

              echo "=== Authenticating to Keycloak ==="
              /opt/keycloak/bin/kcadm.sh config credentials \
                --server $KC \
                --realm master \
                --user admin \
                --password "$KEYCLOAK_ADMIN_PASSWORD"

              echo "=== Creating realm: no-deposit ==="
              if /opt/keycloak/bin/kcadm.sh get realms/no-deposit &>/dev/null; then
                echo "Realm already exists, skipping creation."
              else
                /opt/keycloak/bin/kcadm.sh create realms \
                  -s realm=no-deposit \
                  -s enabled=true \
                  -s displayName="No-Deposit Rental Platform" \
                  -s loginWithEmailAllowed=true \
                  -s registrationAllowed=false \
                  -s bruteForceProtected=true
              fi

              echo "=== Creating client: no-deposit-app ==="
              CLIENT_ID=$(/opt/keycloak/bin/kcadm.sh get clients -r no-deposit \
                --fields id,clientId --format csv --noquotes 2>/dev/null \
                | grep ",no-deposit-app$" | cut -d, -f1 || true)

              if [ -z "$CLIENT_ID" ]; then
                CLIENT_ID=$(/opt/keycloak/bin/kcadm.sh create clients -r no-deposit \
                  -s clientId=no-deposit-app \
                  -s enabled=true \
                  -s publicClient=false \
                  -s secret="$OAUTH2_PROXY_CLIENT_SECRET" \
                  -s 'redirectUris=["https://nodeposit.kubetest.uk/oauth2/callback"]' \
                  -s 'webOrigins=["https://nodeposit.kubetest.uk"]' \
                  -s standardFlowEnabled=true \
                  -i)
                echo "Created client: $CLIENT_ID"
              else
                echo "Client already exists: $CLIENT_ID"
              fi

              echo "=== Adding audience mapper to client ==="
              MAPPER_EXISTS=$(/opt/keycloak/bin/kcadm.sh get \
                clients/$CLIENT_ID/protocol-mappers/models -r no-deposit \
                --fields name --format csv --noquotes 2>/dev/null \
                | grep "^audience-mapper$" || true)
              if [ -z "$MAPPER_EXISTS" ]; then
                /opt/keycloak/bin/kcadm.sh create \
                  clients/$CLIENT_ID/protocol-mappers/models -r no-deposit \
                  -s name=audience-mapper \
                  -s protocol=openid-connect \
                  -s protocolMapper=oidc-audience-mapper \
                  -s 'config={"included.client.audience":"no-deposit-app","id.token.claim":"false","access.token.claim":"true"}'
                echo "Created audience mapper"
              else
                echo "Audience mapper already exists"
              fi

              echo "=== Creating realm roles ==="
              for ROLE in tenant landlord agent admin; do
                /opt/keycloak/bin/kcadm.sh create roles -r no-deposit -s name=$ROLE 2>/dev/null \
                  && echo "Created role: $ROLE" || echo "Role already exists: $ROLE"
              done

              echo "=== Creating test users ==="
              create_user() {
                local USERNAME=$1
                local EMAIL=$2
                local PASSWORD=$3
                local ROLE=$4
                local FIRSTNAME=$5
                local LASTNAME=$6

                USER_ID=$(/opt/keycloak/bin/kcadm.sh get users -r no-deposit \
                  -q username=$USERNAME --fields id --format csv --noquotes 2>/dev/null \
                  | head -1 || true)

                if [ -z "$USER_ID" ]; then
                  USER_ID=$(/opt/keycloak/bin/kcadm.sh create users -r no-deposit \
                    -s username=$USERNAME \
                    -s email=$EMAIL \
                    -s firstName=$FIRSTNAME \
                    -s lastName=$LASTNAME \
                    -s enabled=true \
                    -s emailVerified=true \
                    -i)
                  /opt/keycloak/bin/kcadm.sh set-password -r no-deposit \
                    --username $USERNAME --new-password "$PASSWORD"
                  echo "Created user: $USERNAME"
                else
                  echo "User already exists: $USERNAME"
                fi

                ROLE_ID=$(/opt/keycloak/bin/kcadm.sh get roles -r no-deposit \
                  --fields id,name --format csv --noquotes 2>/dev/null \
                  | grep ",$ROLE$" | cut -d, -f1 || true)

                if [ -n "$ROLE_ID" ] && [ -n "$USER_ID" ]; then
                  /opt/keycloak/bin/kcadm.sh add-roles -r no-deposit \
                    --uusername $USERNAME --rolename $ROLE 2>/dev/null || true
                fi
              }

              create_user tenant1   tenant1@nodeposit.example   "Tenant1Pass!"   tenant   Alice   Smith
              create_user landlord1 landlord1@nodeposit.example "Landlord1Pass!" landlord Bob     Jones
              create_user agent1    agent1@nodeposit.example    "Agent1Pass!"    agent    Carol   Admin

              echo "=== Setting up MFA for agent and admin roles ==="

              # Create mfa-required realm role — assigned to users that must use TOTP
              /opt/keycloak/bin/kcadm.sh create roles -r no-deposit \
                -s name=mfa-required \
                -s 'description=Requires TOTP at login' \
                2>/dev/null && echo "Created role: mfa-required" || echo "Role already exists: mfa-required"

              # Assign mfa-required to agent1 (and any future agent/admin users)
              /opt/keycloak/bin/kcadm.sh add-roles -r no-deposit \
                --uusername agent1 --rolename mfa-required 2>/dev/null || true

              # Set realm OTP policy (TOTP, SHA1, 6 digits, 30s)
              /opt/keycloak/bin/kcadm.sh update realms/no-deposit \
                -s otpPolicyType=totp \
                -s otpPolicyAlgorithm=HmacSHA1 \
                -s otpPolicyDigits=6 \
                -s otpPolicyPeriod=30 2>/dev/null || true

              # Copy the default browser flow as browser-mfa (idempotent)
              if ! /opt/keycloak/bin/kcadm.sh get authentication/flows -r no-deposit \
                  --fields alias --format csv --noquotes 2>/dev/null | grep -q "^browser-mfa$"; then
                /opt/keycloak/bin/kcadm.sh create authentication/flows/browser/copy \
                  -r no-deposit -s newName="browser-mfa"
                echo "Copied browser flow to browser-mfa"
              else
                echo "Flow browser-mfa already exists"
              fi

              # Find the Conditional OTP sub-flow within browser-mfa
              COND_FLOW_ID=$(/opt/keycloak/bin/kcadm.sh get authentication/flows/browser-mfa/executions \
                -r no-deposit --fields displayName,flowId --format csv --noquotes 2>/dev/null \
                | grep "Conditional OTP" | cut -d, -f2 || true)

              if [ -n "$COND_FLOW_ID" ]; then
                COND_FLOW_ALIAS=$(/opt/keycloak/bin/kcadm.sh get authentication/flows \
                  -r no-deposit --fields id,alias --format csv --noquotes 2>/dev/null \
                  | grep "^$COND_FLOW_ID," | cut -d, -f2 || true)

                if [ -n "$COND_FLOW_ALIAS" ]; then
                  # Remove "Condition - User Configured" so TOTP fires for any mfa-required user
                  # even if they haven't set it up yet (they'll be prompted on first login)
                  OLD_COND=$(/opt/keycloak/bin/kcadm.sh get "authentication/flows/$COND_FLOW_ALIAS/executions" \
                    -r no-deposit --fields id,providerId --format csv --noquotes 2>/dev/null \
                    | grep ",condition-user-configured$" | cut -d, -f1 || true)
                  if [ -n "$OLD_COND" ]; then
                    /opt/keycloak/bin/kcadm.sh delete "authentication/executions/$OLD_COND" \
                      -r no-deposit 2>/dev/null || true
                    echo "Removed condition-user-configured"
                  fi

                  # Add Condition - User Role (idempotent)
                  if ! /opt/keycloak/bin/kcadm.sh get "authentication/flows/$COND_FLOW_ALIAS/executions" \
                      -r no-deposit --fields providerId --format csv --noquotes 2>/dev/null \
                      | grep -q "^condition-user-role$"; then
                    /opt/keycloak/bin/kcadm.sh create "authentication/flows/$COND_FLOW_ALIAS/executions/execution" \
                      -r no-deposit -s provider=condition-user-role
                    echo "Added condition-user-role execution"
                  fi

                  # Set REQUIRED and configure for mfa-required realm role
                  ROLE_COND_ID=$(/opt/keycloak/bin/kcadm.sh get "authentication/flows/$COND_FLOW_ALIAS/executions" \
                    -r no-deposit --fields id,providerId --format csv --noquotes 2>/dev/null \
                    | grep ",condition-user-role$" | cut -d, -f1 || true)

                  if [ -n "$ROLE_COND_ID" ]; then
                    /opt/keycloak/bin/kcadm.sh update "authentication/executions/$ROLE_COND_ID" \
                      -r no-deposit -s requirement=REQUIRED 2>/dev/null || true
                    /opt/keycloak/bin/kcadm.sh create "authentication/executions/$ROLE_COND_ID/config" \
                      -r no-deposit \
                      -s alias=mfa-role-condition \
                      -s 'config.condUserRole=no-deposit.mfa-required' \
                      2>/dev/null || echo "Role condition config already exists"
                    echo "Configured TOTP condition for mfa-required role"
                  fi
                fi
              fi

              # Bind browser-mfa flow to realm
              /opt/keycloak/bin/kcadm.sh update realms/no-deposit \
                -s browserFlow=browser-mfa 2>/dev/null \
                && echo "Bound browser-mfa to realm" || echo "Failed to bind browser-mfa"

              echo "=== Keycloak setup complete ==="
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: no-deposit-oauth2-proxy
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: no-deposit-oauth2-proxy
                  key: OAUTH2_PROXY_CLIENT_SECRET
