apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-deposit-oauth2-proxy
  namespace: no-deposit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-deposit-oauth2-proxy
  template:
    metadata:
      labels:
        app: no-deposit-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.kubetest.uk/realms/no-deposit
            - --upstream=http://no-deposit-nginx:80
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://nodeposit.kubetest.uk/oauth2/callback
            - --email-domain=*
            - --cookie-secure=true
            - --skip-provider-button=true
            - --pass-access-token=true
            - --set-xauthrequest=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: no-deposit-oauth2-proxy
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: no-deposit-oauth2-proxy
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: no-deposit-oauth2-proxy
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - containerPort: 4180
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: no-deposit-oauth2-proxy
  namespace: no-deposit
spec:
  type: ClusterIP
  selector:
    app: no-deposit-oauth2-proxy
  ports:
    - port: 4180
      targetPort: 4180
      name: http
