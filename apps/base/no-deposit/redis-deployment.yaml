apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-deposit-redis
  namespace: no-deposit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-deposit-redis
  template:
    metadata:
      labels:
        app: no-deposit-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", ""]  # disable persistence — ephemeral task queue
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: no-deposit-redis
  namespace: no-deposit
spec:
  type: ClusterIP
  selector:
    app: no-deposit-redis
  ports:
    - port: 6379
      targetPort: 6379
