      <!-- SECURITY -->
      <section>
        <div class="section-label">09 · Security</div>
        <h2>Security by Design</h2>

        <div class="card-grid">
          <div class="card">
            <div class="card-icon">🔐</div>
            <div class="tag">Auth</div>
            <h4>Zero-Trust Token Validation</h4>
            <p>Every API request validates the JWT against Keycloak JWKS. No session cookie, no server-side state.</p>
          </div>
          <div class="card">
            <div class="card-icon">🛡️</div>
            <div class="tag">GDPR</div>
            <h4>Data Minimisation</h4>
            <p>KYC documents stored in S3 only, accessed via pre-signed URLs. No PII in logs. Encryption at rest.</p>
          </div>
          <div class="card">
            <div class="card-icon">🔒</div>
            <div class="tag">Secrets</div>
            <h4>Encrypted Secrets (SOPS)</h4>
            <p>All credentials (DB, Stripe, Keycloak) encrypted with SOPS/age in git. No hardcoding, rotation documented.</p>
          </div>
          <div class="card">
            <div class="card-icon">📋</div>
            <div class="tag">Audit</div>
            <h4>Complete Audit Log</h4>
            <p>Every status change on applications, guarantees, and claims recorded with user ID, timestamp, and IP in an immutable table.</p>
          </div>
          <div class="card">
            <div class="card-icon">🧱</div>
            <div class="tag">Network</div>
            <h4>Network Isolation</h4>
            <p>Keycloak admin console behind Tailscale only. Database not exposed externally. Namespaced deployments with NetworkPolicies.</p>
          </div>
          <div class="card">
            <div class="card-icon">⚡</div>
            <div class="tag">API</div>
            <h4>Rate Limiting &amp; Throttling</h4>
            <p>DRF throttling per user/IP. Login endpoints protected with brute-force policy via Keycloak.</p>
          </div>
        </div>
      </section>

