      <!-- DATA MODEL -->
      <section>
        <div class="section-label">06 · Data Model</div>
        <h2>Core Models (Django ORM)</h2>

        <div class="code-block"><pre><span class="code-comment"># models.py (simplified)</span>

    <span class="code-kw">class</span> <span class="code-str">UserProfile</span>(models.Model):
        user        = models.OneToOneField(User, ...)
        keycloak_id = models.UUIDField(unique=True)   <span class="code-comment"># Keycloak sub claim</span>
        role        = models.CharField(choices=ROLES)  <span class="code-comment"># tenant/landlord/agent</span>
        kyc_status  = models.CharField(choices=KYC_STATUS)
        credit_score = models.IntegerField(null=True)

    <span class="code-kw">class</span> <span class="code-str">RentalApplication</span>(models.Model):
        applicant   = models.ForeignKey(UserProfile, ...)
        landlord    = models.ForeignKey(UserProfile, ...)
        address     = models.TextField()
        rent_amount = models.DecimalField(max_digits=10, decimal_places=2)
        deposit_amt = models.DecimalField(...)         <span class="code-comment"># typically 3x monthly rent</span>
        status      = models.CharField(choices=STATUS) <span class="code-comment"># pending/approved/rejected</span>
        created_at  = models.DateTimeField(auto_now_add=True)

    <span class="code-kw">class</span> <span class="code-str">Guarantee</span>(models.Model):
        application    = models.OneToOneField(RentalApplication, ...)
        certificate_no = models.CharField(unique=True)
        valid_from     = models.DateField()
        valid_until    = models.DateField()
        s3_key         = models.CharField()            <span class="code-comment"># PDF in S3</span>
        validate_token = models.UUIDField(default=uuid4) <span class="code-comment"># landlord validation link</span>

    <span class="code-kw">class</span> <span class="code-str">Claim</span>(models.Model):
        guarantee   = models.ForeignKey(Guarantee, ...)
        claimant    = models.ForeignKey(UserProfile, ...)
        amount      = models.DecimalField(...)
        description = models.TextField()
        status      = models.CharField(choices=CLAIM_STATUS)
        documents   = models.ManyToManyField('Document')</pre></div>
      </section>

      <!-- CI/CD -->
      <section>
        <div class="section-label">07 · CI/CD</div>
        <h2>Deployment Pipeline</h2>

        <div class="code-block"><pre><span class="code-comment"># .github/workflows/deploy.yml</span>
    <span class="code-key">name</span>: <span class="code-str">CI/CD Pipeline</span>
    <span class="code-key">on</span>:
      <span class="code-key">push</span>: { <span class="code-key">branches</span>: [<span class="code-str">main</span>, <span class="code-str">staging</span>] }
      <span class="code-key">pull_request</span>: { <span class="code-key">branches</span>: [<span class="code-str">main</span>] }

    <span class="code-key">jobs</span>:
      <span class="code-key">test</span>:
        <span class="code-key">runs-on</span>: <span class="code-str">ubuntu-latest</span>
        <span class="code-key">steps</span>:
          - <span class="code-key">name</span>: <span class="code-str">Django Tests + Coverage</span>
            <span class="code-key">run</span>: |
              pytest --cov=. --cov-fail-under=80
              bandit -r . -x tests/          <span class="code-comment"># Security scan</span>

      <span class="code-key">deploy</span>:
        <span class="code-key">needs</span>: test
        <span class="code-key">if</span>: <span class="code-str">github.ref == 'refs/heads/main'</span>
        <span class="code-key">steps</span>:
          - <span class="code-key">name</span>: <span class="code-str">Build &amp; Push image to GHCR</span>
            <span class="code-key">run</span>: |
              docker build -t ghcr.io/alexbenisch/no-deposit:$SHA .
              docker push ghcr.io/alexbenisch/no-deposit:$SHA
          - <span class="code-key">name</span>: <span class="code-str">Flux reconciles automatically</span>
            <span class="code-comment"># ImageUpdateAutomation patches deployment.yaml → git push → Flux applies</span></pre></div>
      </section>

