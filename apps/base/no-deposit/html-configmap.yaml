apiVersion: v1
kind: ConfigMap
metadata:
  name: no-deposit-html
  namespace: no-deposit
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>No-Deposit Rental Platform</title>
      <style>
        /* Django-inspired placeholder style */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: "Roboto","Lucida Grande","DejaVu Sans","Bitstream Vera Sans",Verdana,Arial,sans-serif;
          background: #f8f8f8;
          color: #333;
          min-height: 100vh;
        }
        header {
          background: #092e20;
          color: #fff;
          padding: 0 40px;
          display: flex;
          align-items: center;
          height: 60px;
          box-shadow: 0 2px 4px rgba(0,0,0,.3);
        }
        header h1 {
          font-size: 1.1rem;
          font-weight: 600;
          letter-spacing: .5px;
        }
        header .version {
          margin-left: 16px;
          font-size: .75rem;
          opacity: .6;
          border: 1px solid rgba(255,255,255,.3);
          padding: 2px 8px;
          border-radius: 3px;
        }
        .container {
          max-width: 900px;
          margin: 60px auto;
          padding: 0 24px;
        }
        .hero {
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 4px;
          padding: 40px 48px;
          margin-bottom: 32px;
          border-top: 4px solid #092e20;
        }
        .hero h2 {
          font-size: 1.8rem;
          color: #092e20;
          margin-bottom: 8px;
        }
        .hero p {
          color: #666;
          font-size: .95rem;
          line-height: 1.6;
          margin-top: 8px;
        }
        .badge {
          display: inline-block;
          background: #e8f5e9;
          color: #2e7d32;
          border: 1px solid #a5d6a7;
          border-radius: 3px;
          font-size: .75rem;
          padding: 2px 10px;
          font-weight: 600;
          letter-spacing: .5px;
          margin-bottom: 16px;
        }
        .sections {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 20px;
          margin-bottom: 32px;
        }
        .card {
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 4px;
          padding: 28px;
          text-decoration: none;
          color: inherit;
          display: block;
          transition: border-color .15s, box-shadow .15s;
        }
        .card:hover {
          border-color: #092e20;
          box-shadow: 0 2px 8px rgba(9,46,32,.12);
        }
        .card-icon {
          font-size: 2rem;
          margin-bottom: 12px;
        }
        .card h3 {
          font-size: 1rem;
          font-weight: 600;
          color: #092e20;
          margin-bottom: 6px;
        }
        .card p {
          font-size: .85rem;
          color: #777;
          line-height: 1.5;
        }
        .card .role-tag {
          display: inline-block;
          margin-top: 12px;
          font-size: .72rem;
          font-weight: 600;
          letter-spacing: .4px;
          padding: 2px 8px;
          border-radius: 3px;
        }
        .role-tenant  { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }
        .role-landlord{ background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .role-agent   { background: #f3e5f5; color: #6a1b9a; border: 1px solid #ce93d8; }
        .role-admin   { background: #fce4ec; color: #880e4f; border: 1px solid #f48fb1; }
        .info-box {
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 4px;
          padding: 24px 28px;
          font-size: .875rem;
          line-height: 1.7;
        }
        .info-box h4 {
          font-size: .8rem;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: .8px;
          color: #999;
          margin-bottom: 12px;
        }
        .info-box table { width: 100%; border-collapse: collapse; }
        .info-box td { padding: 5px 12px 5px 0; vertical-align: top; }
        .info-box td:first-child { color: #555; font-weight: 500; white-space: nowrap; width: 100px; }
        .info-box code {
          background: #f4f4f4;
          padding: 1px 6px;
          border-radius: 3px;
          font-size: .85em;
          font-family: "Roboto Mono", monospace;
        }
        footer {
          text-align: center;
          color: #aaa;
          font-size: .8rem;
          padding: 40px 24px;
        }
      </style>
    </head>
    <body>
      <header>
        <h1>No-Deposit Rental Platform</h1>
        <span class="version">Placeholder</span>
      </header>

      <div class="container">
        <div class="hero">
          <div class="badge">Django · In Development</div>
          <h2>Welcome to NodePosit</h2>
          <p>
            A zero-deposit rental platform connecting tenants, landlords, and letting
            agents. This is a Django placeholder page. Select your area below to get
            started, or log in with a test account to explore the authenticated experience.
          </p>
        </div>

        <div class="sections">
          <a class="card" href="/tenant/">
            <div class="card-icon">🏠</div>
            <h3>Tenant Portal</h3>
            <p>Search listings, manage your rental applications, track your deposit-free guarantee status, and communicate with your landlord.</p>
            <span class="role-tag role-tenant">Tenant</span>
          </a>

          <a class="card" href="/landlord/">
            <div class="card-icon">🔑</div>
            <h3>Landlord Portal</h3>
            <p>List properties, review tenant applications, manage tenancies, and track guaranteed rent payments.</p>
            <span class="role-tag role-landlord">Landlord</span>
          </a>

          <a class="card" href="/agency/">
            <div class="card-icon">🏢</div>
            <h3>Agency Portal</h3>
            <p>Manage a portfolio of properties across multiple landlords, onboard tenants, and handle compliance documents.</p>
            <span class="role-tag role-agent">Agent</span>
          </a>

          <a class="card" href="/admin/">
            <div class="card-icon">⚙️</div>
            <h3>Administration</h3>
            <p>Django admin interface for platform operators — users, roles, audit logs, and configuration.</p>
            <span class="role-tag role-admin">Admin</span>
          </a>
        </div>

        <div class="info-box">
          <h4>Test Accounts</h4>
          <table>
            <tr>
              <td>Tenant</td>
              <td><code>tenant1</code> / <code>Tenant1Pass!</code></td>
            </tr>
            <tr>
              <td>Landlord</td>
              <td><code>landlord1</code> / <code>Landlord1Pass!</code></td>
            </tr>
            <tr>
              <td>Agent</td>
              <td><code>agent1</code> / <code>Agent1Pass!</code></td>
            </tr>
          </table>
        </div>
      </div>

      <footer>
        No-Deposit Rental Platform &mdash; Staging &mdash; Keycloak realm: <code>no-deposit</code>
      </footer>
    </body>
    </html>
