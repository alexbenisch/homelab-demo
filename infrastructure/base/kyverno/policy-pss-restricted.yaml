apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-security-restricted
  annotations:
    policies.kyverno.io/title: Pod Security Standard - Restricted
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  # Start in Audit to see what would be blocked before enforcing.
  # Switch to Enforce once existing workloads are compliant.
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-run-as-nonroot
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must run as non-root (set securityContext.runAsNonRoot: true and allowPrivilegeEscalation: false)."
        pattern:
          spec:
            =(securityContext):
              =(runAsNonRoot): true
            containers:
              - =(securityContext):
                  =(runAsNonRoot): true
                  =(allowPrivilegeEscalation): false

    - name: require-readonly-rootfs
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Root filesystem must be read-only (set securityContext.readOnlyRootFilesystem: true)."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
