name: Smoke Test — Staging Login

# Run manually or after no-deposit build succeeds.
# Requires staging to be deployed and accessible at nodeposit.kubetest.uk.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test against"
        required: false
        default: "https://nodeposit.kubetest.uk"
  workflow_run:
    workflows: ["Build and Push No-Deposit Django"]
    types: [completed]
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # Only run post-build smoke test on successful build
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Playwright
        run: pip install playwright && playwright install chromium --with-deps

      # Pass 1: login + read-only checks (creates UserProfiles as a side-effect)
      - name: Pass 1 — Login and read-only endpoint checks (all roles)
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://nodeposit.kubetest.uk' }}
        run: python scripts/e2e-api-tests.py "$BASE_URL"

      # Seed: create the test property now that all UserProfiles exist
      - name: Seed test property
        id: seed
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://nodeposit.kubetest.uk' }}
        run: |
          PROPERTY_ID=$(python scripts/seed-e2e.py "$BASE_URL")
          echo "property_id=$PROPERTY_ID" >> "$GITHUB_OUTPUT"
          echo "Test property ID: $PROPERTY_ID"

      # Pass 2: full CRUD flow — tenant applies, agent approves + issues guarantee, landlord claims
      - name: Pass 2 — Full CRUD flow (submit, approve, guarantee, claim)
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://nodeposit.kubetest.uk' }}
        run: python scripts/e2e-api-tests.py "$BASE_URL" --property-id ${{ steps.seed.outputs.property_id }}
